name: Test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run browser workflow
        run: |
          python -m plotcraft > /tmp/plotcraft.log 2>&1 &
          python - <<'PYTHON'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/api/health')
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Server did not start')
          PYTHON
          node tests/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-v0.1.0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distributable packages
        run: |
          python -m pip install build
          python -m build
          git archive --format=zip --prefix=plotcraft-0.1.0/ HEAD -o dist/plotcraft-0.1.0-source.zip
      - name: Publish first release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists; preserving published assets."
          else
            gh release create v0.1.0 dist/* --target "$GITHUB_SHA" --title "Plotcraft v0.1.0 — Live data. Your design." --notes-file CHANGELOG.md
          fi
